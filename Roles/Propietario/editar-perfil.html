<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Barba y Estilo - Editar Perfil del Propietario </title>
    <link rel="stylesheet" href="../../CSS/barber.css">
</head>
<body>
    <header>
        <nav>
            <a href="dashboard-propietario.html"> Resumen General </a>
            <a href="reservas.html"> Reservas </a>
            <a href="ingresos.html"> Ingresos </a>
            <a href="perfil.html"> Perfil </a>
            <a href="../../Cuenta/Login.html"> Cerrar Sesión </a>
        </nav>
    </header>

    <main>

        <h1> Editar perfil </h1>

        <section>
            <h2> Datos personales </h2>

            <form id="form-datos" class="datos-personales">

                <label for="nombre"> Nombre: </label>
                <input type="text" id="nombre" required/>

                <label for="correo"> Correo Electrónico: </label>
                <input type="email" id="correo" required/>
                <p id="mensaje-datos" class="mensaje-error"></p>

                <label for="telefono"> Número de Teléfono: </label>
                <input type="tel" id="telefono" required/>

                <button type="submit"> Guardar cambios </button>

            </form>

        </section>

        <section>
            <h2> Seguridad de la cuenta </h2>

            <form id="form-seguridad" class="contrasena">
                <label for="contrasena-actual"> Contraseña Actual: </label>
                <input type="password" id="contrasena-actual" required/>

                <label for="contrasena-nueva"> Contraseña Nueva: </label>
                <input type="password" id="contrasena-nueva" required/>

                <label for="contrasena-confirmar"> Confirmar Contraseña: </label>
                <input type="password" id="contrasena-confirmar" required/>

                <p id="mensaje-seguridad" class="mensaje-error"></p>

                <button type="submit"> Cambiar contraseña</button>
            </form>

        </section>

        <a href="perfil.html"> Cancelar </a>

    </main>

    <footer>
        <p>&copy; 2026 Barba y Estilo - Barbería Urbana. Todos los derechos reservados.</p>
    </footer>

    <script src="../../JavaScript/edicion-perfil-propietario.js"></script>

</body>
</html>
