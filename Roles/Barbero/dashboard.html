<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Barba y Estilo - Panel del Barbero </title>
    <link rel="stylesheet" href="../../CSS/barber.css">
</head>
<body>
    
    <header>
        <nav>
            <a href="dashboard.html"> Resumen </a>
            <a href="cortes.html"> Cortes </a>
            <a href="perfil.html"> Perfil </a>
            <a href="../../Cuenta/Login.html"> Cerrar Sesión </a>
            <button id="boton_cambio" aria-label="Cambiar modo claro/oscuro">🌙</button>
        </nav>
    </header>

    <main>
        
        <h1> Panel del Barbero </h1>
        <p> Gestiona tu jornada en un solo lugar </p>

        <section class="kpi-grid">

            <article class="card-kpi">
                <h3> Total de Cortes </h3>
                <p class="kpi-value" id="total-cortes"> 0 </p>
            </article>

            <article class="card-kpi">
                <h3> Ingresos Generados </h3>
                <p class="kpi-value" id="total-ingresos"> $0 </p>
            </article>

        </section>

        <section>
            <h2> Ultimos Cortes Realizados </h2>

            <table class="tabla-datos">
                <thead>
                    <tr>
                        <th> Cliente </th>
                        <th> Servicios </th>
                        <th> Fechas </th>
                        <th> Ingresos </th>
                    </tr>
                </thead>
                <tbody id="ultimos-cortes"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Barba y Estilo - Barbería Urbana. Todos los derechos reservados.</p>
    </footer>

    <script src="../../JavaScript/dashboard.js"></script>

<script src="../../JavaScript/tema.js"></script>
</body>
</html>
