<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> BArba y Estilo - Panel del Barbero </title>
    <link rel="stylesheet" href="../../CSS/barber.css">
</head>
<body>
    
    <header>
        <nav>
            <a href="dashboard.html"> Resumen </a>
            <a href="cortes.html"> Cortes </a>
            <a href="perfil.html"> Perfil </a>
            <a href="../../Cuenta/login.html"> Cerrar Sesión </a>
        </nav>
    </header>

    <main>
        
        <h1> Panel del Barbero </h1>
        <p> Gestiona tu jornada en un solo lugar </p>

        <section>

            <article class="total-cortes">
                <h2> Total de Cortes </h2>
                <p id="total-cortes">  </p>
            </article>

            <article class="total-ingresos">
                <h2> Ingresos Generados </h2>
                <p id="total-ingresos"> 0 </p>
            </article>

        </section>

        <section>
            <h2> Ultimos Cortes Realizados </h2>

            <table>
                <thead>
                    <tr>
                        <th> Cliente </th>
                        <th> Servicios </th>
                        <th> Fechas </th>
                        <th> Ingresos </th>
                    </tr>
                    <tbody id="ultimos-cortes"></tbody>
                </thead>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Barba y Estilo - Barbería Urbana. Todos los derechos reservados.</p>
    </footer>

    <script src="../../JavaScript/dashboard.js"></script>
