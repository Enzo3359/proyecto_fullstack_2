<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Barba y Estilo - Olvidaste tu contraseña </title>
</head>
<body>
    
    <header>
        <nav>
            <a href="Login.html"> Login </a>
            <a href="Register.html"> Register </a>
        </nav>
    </header>

    <main>
        <div class="forgot-container">
        <!-- Encabezado con branding -->
        <div class="brand-header">
            <h1 class="logo-title">Barba y Estilo</h1>
            <span class="sub-title">- BARBERIA -</span>
        </div>

        <!-- Título de la sección -->
        <h2 class="form-title">¿OLVIDASTE TU CONTRASEÑA?</h2>
        <p class="form-description">
            Introduce tu correo electrónico y te enviaremos un enlace para establecerla.
        </p>

        <!-- Formulario -->
        <form action="#" method="POST" class="auth-form">
            <div class="input-group">
                <label for="email">CORREO ELECTRÓNICO</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="ejemplo@correo.com" 
                    required 
                />
            </div>

            <button type="submit" class="btn-primary">ENVIAR ENLACE</button>
        </form>

        <!-- Enlace para regresar -->
        <div class="back-link-container">
            <a href="Login.html" class="back-link">VOLVER A LOG IN</a>
        </div>
    </div>
    </main>

</body>
</html>
