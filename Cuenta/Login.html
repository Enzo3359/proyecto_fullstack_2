<!DOCTYPE html>
<html lang="es">
<head>

    <title> Barba y Estilo - Login </title>
    <link rel="stylesheet" href="../CSS/barber.css">
</head>
<body>
    
    <header>
        <nav>
            <a href="../HTML/index.html"> Home </a>
            <a href="register.html"> Registrar </a>
        </nav>
    </header>

    <main>
        <h1> Login </h1>
        <p> Ingresa tu correo y tu contraseña para iniciar sesión </p>

        <form>
            
            <label for="correo"> Correo Electrónico: </label>
            <input type="email" placeholder="Ingrese su Correo" id="correo" required/>

            <label for="contraseña"> Contraseña: </label>
            <input type="password" placeholder="Ingrese Contraseña" id="contraseña" required/>

            <button type="submit"> Iniciar sesión </button> 

        </form>
        <a href="forgotPassword.html"> ¿Olvidaste tu Contraseña? </a>
        
        <a href="register.html">  Crear una cuenta </a>

    </main>

    </footer>

</body>
