<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Barba y Estilo - Login </title>
    <link rel="stylesheet" href="../CSS/barber.css">
</head>
<body>
    
    <header>
        <nav>
            <a href="../HTML/index.html"> Home </a>
            <a href="Register.html"> Registrar </a>
        </nav>
    </header>

    <main>
        <h1> Login </h1>
        <p> Ingresa tu correo y tu contraseña para iniciar sesión </p>

        <form>
            
            <label for="correo"> Correo Electrónico: </label>
            <input type="email" placeholder="Ingrese su Correo" id="correo" required/>

            <label for="contrasena"> Contraseña: </label>
            <input type="password" placeholder="Ingrese Contraseña" id="contrasena" required/>

            <p id="mensaje-login" class="mensaje-error"></p>

            <button type="submit"> Iniciar sesión </button>

        </form>
        <a href="forgot-password.html"> ¿Olvidaste tu Contraseña? </a>
        
        <a href="Register.html">  Crear una cuenta </a>

    </main>

    <footer>
        <p>&copy; 2026 Barba y Estilo - Barbería Urbana. Todos los derechos reservados.</p>
    </footer>

    <script src="../JavaScript/auth.js"></script>
    <script src="../JavaScript/login.js"></script>

</body>
</html>
