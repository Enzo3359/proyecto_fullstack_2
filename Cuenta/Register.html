<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Barba y Estilo - Registro </title>
    <link rel="stylesheet" href="../CSS/barber.css">
</head>
<body>
    
    <header>
        <nav>
            <a href="../HTML/index.html"> Home </a>
            <a href="Login.html"> Login </a>
            <button id="boton_cambio" aria-label="Cambiar modo claro/oscuro">🌙</button>
        </nav>
    </header>

    <main>
        <h1> Registro </h1>
        <p> Ingresa los datos para crear tu cuenta </p>

        <form>

            <label for="nombre"> Nombre Completo: </label> 
            <input type="text" placeholder="Ingrese su nombre" id="nombre" required/>

            <label for="correo"> Correo Electronico: </label>
            <input type="email" placeholder="Ingrese su Correo" id="correo" required/>

            <label for="contraseña"> Contraseña: </label> 
            <input type="password" placeholder="Ingrese Contraseña" id="contraseña" required  />

            <a href="Login.html"> ¿ya tienes una cuenta? </a>

            <p id="mensaje-registro" class="mensaje-error"></p>

            <button type="submit"> REGISTRARSE </button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Barba y Estilo - Barbería Urbana. Todos los derechos reservados.</p>
    </footer>

    <script src="../JavaScript/auth.js"></script>
    <script src="../JavaScript/register.js"></script>

<script src="../JavaScript/tema.js"></script>
</body>
</html>
